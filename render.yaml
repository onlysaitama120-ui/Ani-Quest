# Render deployment config for AniQuest
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Create a free Turso database -> copy its URL + auth token
#   2. Create a free Render account -> "New" -> "Blueprint"
#   3. Point it at this repo. Render reads this file.
#   4. Paste TURSO_URL and TURSO_AUTH_TOKEN into the service env vars.
#   5. Deploy. Done.

services:
  - type: web
    name: aniquest
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs --prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Vite 8 requires Node >= 20.19 / >= 22.12 — pin a supported LTS.
      - key: NODE_VERSION
        value: 22.12.0
      # Persistent session-signing secret (survives redeploys).
      - key: SESSION_SECRET
        generateValue: true
      # Set these two manually from your Turso database (see README).
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Email verification (Resend). Get an API key at https://resend.com/api-keys
      - key: RESEND_API_KEY
        sync: false
      # Sender. Requires a verified domain in Resend for real delivery.
      - key: EMAIL_FROM
        sync: false
      # Public URL of this app (used in verification emails). If unset, it is
      # derived from the request host automatically.
      - key: APP_URL
        sync: false